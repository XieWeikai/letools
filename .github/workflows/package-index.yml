name: Package index

on:
  repository_dispatch:
    types: [native-release]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Native release tag to index
        required: true
        default: native-v0.1.0

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download released wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern 'letools_native-*.whl' --dir dist
      - name: Build Python package index
        run: python scripts/build_simple_index.py dist public "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy package index
        id: deployment
        uses: actions/deploy-pages@v4
