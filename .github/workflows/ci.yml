name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --locked --group test
      - run: uv run pytest -q
      - run: uv run letools doctor

  native:
    name: Native extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --locked --group test --group native-dev
      - run: uv run maturin develop --manifest-path native/Cargo.toml --locked
      - run: uv run pytest -q
      - run: |
          uv run letools doctor | grep '"provider": "letools-native"'
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked -- -D warnings
