name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  user-install:
    name: Locked user install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --locked --group test
      - run: |
          uv tool install .
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"
      - run: uv run pytest -q
      - run: |
          letools doctor | grep '"video-split"'
      - name: Locked environment command link
        run: |
          export UV_TOOL_BIN_DIR="${RUNNER_TEMP}/letools-bin"
          ./scripts/link_letools.sh --no-sync
          "${UV_TOOL_BIN_DIR}/letools" --help
          ./scripts/link_letools.sh --remove

  python-fallback:
    name: Python fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --locked --group test
      - run: uv pip uninstall letools-native
      - run: uv run --no-sync pytest -q
      - run: |
          uv run --no-sync letools doctor | grep '"provider": "python"'

  external-integrations:
    name: Doctor and Visualizer upstreams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"
      - run: uv sync --locked --group test
      - name: Test complete vendored Doctor
        run: |
          PYTHONPATH=third_party/external/lerobot-doctor/src \
            uv run --no-sync pytest -q third_party/external/lerobot-doctor/tests
      - name: Prepare patched Visualizer cache
        run: |
          uv run --no-sync letools visualizer setup \
            --cache-dir "${RUNNER_TEMP}/visualizer"
      - name: Test and build complete vendored Visualizer
        working-directory: ${{ runner.temp }}/visualizer/source
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          bun test
          bun run type-check
          bun run lint
          bun run format:check
          bun run build
      - name: Verify wheel carries both integrations
        run: |
          uv build --wheel --out-dir "${RUNNER_TEMP}/dist"
          unzip -l "${RUNNER_TEMP}"/dist/*.whl | grep 'lerobot_doctor/cli.py'
          unzip -l "${RUNNER_TEMP}"/dist/*.whl | grep '_external/lerobot-dataset-visualizer/package.json'
          unzip -l "${RUNNER_TEMP}"/dist/*.whl | grep '_external/UPSTREAM.toml'

  native:
    name: Native extension (portable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv sync --locked --group test --group native-dev
      - run: uv run maturin develop --manifest-path native/Cargo.toml --locked
      - run: uv run pytest -q
      - run: |
          uv run letools doctor | grep '"provider": "letools-native"'
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked -- -D warnings

  native-video:
    name: Native extension (FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install FFmpeg development libraries
        run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev pkg-config
      - run: uv sync --locked --group test --group native-dev
      - run: uv run maturin develop --manifest-path native/Cargo.toml --locked --features video
      - run: uv run pytest -q
      - run: |
          uv run letools doctor | grep '"video-split"'
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --features video -- -D warnings
