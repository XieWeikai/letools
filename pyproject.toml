[project]
name = "letools"
version = "0.1.0"
description = "High-performance tools for creating and converting LeRobot datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Weikai Xie", email = "xxxweikai@gmail.com" }]
keywords = ["lerobot", "dataset", "robotics", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "av>=15,<17",
    "fastapi>=0.110,<1",
    "h5py>=3.12,<4",
    "huggingface-hub>=0.24,<2",
    "letools-native==0.2.0",
    "numpy>=2",
    "pandas>=2,<4",
    "pydantic>=2.5,<3",
    "pyarrow>=18",
    "rich>=13,<15",
    "uvicorn>=0.27,<1",
]

[project.scripts]
letools = "letools.cli:main"

[dependency-groups]
test = ["pytest>=8"]
native-dev = ["maturin>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/letools",
    "third_party/external/lerobot-doctor/src/lerobot_doctor",
]

[tool.hatch.build.targets.wheel.force-include]
"third_party/UPSTREAM.toml" = "letools/_external/UPSTREAM.toml"
"third_party/licenses/Apache-2.0.txt" = "letools/_external/licenses/Apache-2.0.txt"
"third_party/external/lerobot-dataset-visualizer" = "letools/_external/lerobot-dataset-visualizer"
"third_party/patches/lerobot-dataset-visualizer" = "letools/_external/patches/lerobot-dataset-visualizer"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/src",
    "/third_party",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "letools-native"
url = "https://xieweikai.github.io/letools/simple"
explicit = true

[tool.uv.sources]
letools-native = { index = "letools-native" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
