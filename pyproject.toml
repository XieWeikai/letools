[project]
name = "letools"
version = "0.1.0"
description = "High-performance tools for creating and converting LeRobot datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=15,<17",
    "numpy>=2",
    "pyarrow>=18",
]

[project.scripts]
letools = "letools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.maturin]
module-name = "letools._core"
python-packages = ["letools"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
