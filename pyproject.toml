[project]
name = "letools"
version = "0.1.0"
description = "High-performance tools for creating and converting LeRobot datasets"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Weikai Xie", email = "xxxweikai@gmail.com" }]
keywords = ["lerobot", "dataset", "robotics", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "av>=15,<17",
    "h5py>=3.12,<4",
    "letools-native==0.1.0",
    "numpy>=2",
    "pyarrow>=18",
]

[project.scripts]
letools = "letools.cli:main"

[dependency-groups]
test = ["pytest>=8"]
native-dev = ["maturin>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/letools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "letools-native"
url = "https://xieweikai.github.io/letools/simple"
explicit = true

[tool.uv.sources]
letools-native = { index = "letools-native" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
