[project]
name = "letools-editor"
version = "0.1.0"
description = "Optional high-performance editor for LeRobot v2.1 and v3.0 datasets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Weikai Xie", email = "xxxweikai@gmail.com" }]
dependencies = [
    "letools>=0.1.0",
    "imageio-ffmpeg>=0.6,<1",
    "numpy>=2",
    "pyarrow>=18",
]

[project.scripts]
letools-editor = "letools_editor.cli:main"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "letools_editor._native"
features = ["pyo3/extension-module"]
