[package]
name = "letools-native"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Optional native acceleration for letools"
repository = "https://github.com/XieWeikai/letools"

[lib]
name = "letools_native"
crate-type = ["cdylib"]

[features]
default = []
video = ["dep:ffmpeg-next", "dep:sha2", "dep:tempfile"]

[dependencies]
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["format"], optional = true }
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
libc = "0.2"
