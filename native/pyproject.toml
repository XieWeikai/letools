[project]
name = "letools-native"
version = "0.2.0"
description = "Optional native acceleration for letools"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Weikai Xie", email = "xxxweikai@gmail.com" }]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.maturin]
module-name = "letools_native"
bindings = "pyo3"
strip = true

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"
